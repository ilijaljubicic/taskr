[package]
name = "taskr-environment"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
native = ["dep:rusqlite", "dep:tokio", "dep:uuid", "dep:taskr-core", "taskr-herdr/native"]

[dependencies]
taskr-herdr = { path = "../taskr-herdr", default-features = false }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"], optional = true }
uuid = { workspace = true, optional = true }

taskr-core = { path = "../taskr-core", optional = true }
