[workspace]
members = [
    ".",
    "crates/taskr-controller",
    "crates/taskr-core",
    "crates/taskr-herdr",
    "crates/taskr-environment",
]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server"] }
ractor = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

[package]
name = "taskr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
taskr-controller = { path = "crates/taskr-controller" }
