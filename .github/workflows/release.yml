name: taskr Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build & Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev musl-tools pkg-config

      - name: Install Herdr CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/herdr" --version

      - name: Test
        run: cargo test --workspace --locked

      - name: Build taskr binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cargo build --release --locked --bin taskr
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "$(uname -m)" == "arm64" ]]; then
              rustup target add aarch64-apple-darwin
              cargo build --release --locked --target aarch64-apple-darwin --bin taskr
            else
              rustup target add x86_64-apple-darwin
              cargo build --release --locked --target x86_64-apple-darwin --bin taskr
            fi
          else
            echo "Unsupported platform: $RUNNER_OS"
            exit 1
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            package_dir="artifacts/taskr-linux-x86_64"
            mkdir -p "$package_dir"
            cp target/release/taskr "$package_dir/taskr"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "$(uname -m)" == "arm64" ]]; then
              package_dir="artifacts/taskr-darwin-arm64"
              mkdir -p "$package_dir"
              cp target/aarch64-apple-darwin/release/taskr "$package_dir/taskr"
            else
              package_dir="artifacts/taskr-darwin-x86_64"
              mkdir -p "$package_dir"
              cp target/x86_64-apple-darwin/release/taskr "$package_dir/taskr"
            fi
          fi
          cd artifacts
          for dir in taskr-*; do
            tar -czf "${dir}.tar.gz" -C "$dir" .
          done

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.os }}
          path: artifacts/*.tar.gz

  release:
    name: Create GitHub Release & Publish npm
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download archives
        uses: actions/download-artifact@v6
        with:
          pattern: binaries-*
          merge-multiple: true
          path: artifacts

      - name: List downloaded archives
        run: ls -R artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: "Automated taskr release for ${{ github.ref_name }}."
          draft: false
          prerelease: false
          files: artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          cd npm/taskr

          npm version "$VERSION" --no-git-tag-version --allow-same-version
          mkdir -p artifacts
          cp ../../artifacts/*.tar.gz artifacts/

          npm pack --dry-run
          npm publish --access public
