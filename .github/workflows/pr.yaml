name: test

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-wasm:
    name: Check core and execution ports for Workers Wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust with Wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check library and public API consumers
        run: |
          make check-core-wasm
          make check-execution-wasm

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev pkg-config

      # The Rust test suite is hermetic (every herdr invocation goes through
      # a per-test fake CLI), but CI still provisions the real Herdr CLI so
      # packaging assumptions (install path, launcher flags, version probe)
      # stay honest. See docs/deployment.md for the operator equivalent.
      - name: Install Herdr CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/herdr" --version

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  required-check:
    name: test
    if: ${{ always() }}
    needs: [core-wasm, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful native and Wasm checks
        env:
          CORE_RESULT: ${{ needs.core-wasm.result }}
          NATIVE_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$CORE_RESULT" != success ] || [ "$NATIVE_RESULT" != success ]; then
            echo "Required checks failed: Wasm=$CORE_RESULT, native=$NATIVE_RESULT"
            exit 1
          fi
