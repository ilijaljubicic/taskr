[project]
name = "taskr-export-project-tasks"
version = "0.1.0"
description = "Export a project's taskr cards (plans + tasks) into a single self-contained HTML page."
requires-python = ">=3.11"
dependencies = []  # standard library only (urllib, json)

[project.scripts]
export-project-tasks = "export_project_tasks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["export_project_tasks.py"]

[tool.hatch.build.targets.wheel.sources]
"export_project_tasks.py" = "export_project_tasks.py"
